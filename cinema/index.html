<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Giant Leap</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: none; }
  .hud { position: fixed; font: 600 13px/1.2 ui-monospace, Menlo, Consolas, monospace; color: #aab7cf;
         background: rgba(5, 8, 20, .8); padding: 6px 10px; border: 1px solid #26304a; border-radius: 4px; pointer-events: none; }
  #fps { top: 8px; left: 8px; display: none; color: #b6ff6b; }
  #goto { bottom: 14px; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .15s; color: #ffd27a; font-size: 16px; }
  #toast { top: 8px; right: 8px; opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="fps" class="hud"></div>
<div id="goto" class="hud"></div>
<div id="toast" class="hud"></div>

<script src="../engine/tween.js"></script>
<script src="engine/util.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/space.js"></script>
<script src="engine/earth.js"></script>
<script src="engine/particles.js"></script>
<script src="engine/type.js"></script>
<script src="engine/stage.js"></script>
<script src="scenes.js"></script>
<script>
  window.addEventListener('mousemove', function () {
    var c = document.getElementById('stage');
    c.style.cursor = 'default'; clearTimeout(window.__cur);
    window.__cur = setTimeout(function () { c.style.cursor = 'none'; }, 1500);
  });
  Show.boot(document.getElementById('stage'));
  window.PixelDeck = Show.api;   // same automation API as pixeldeck (used by tools/record.js)
</script>
</body>
</html>
